apiVersion: v1
kind: Service
metadata:
  name: app-1-service
  namespace: my-ns
  labels:
    app: app-1
spec:
    type: LoadBalancer
    selector:
      app: app-1
    ports:
      - protocol: TCP
        port: 80
        targetPort: 8080
