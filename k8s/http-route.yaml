apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app-http-route
  namespace: my-ns
spec:
  parentRefs:
    - name: app-gateway
  rules:
    - backendRefs:
        - name: app-1-service
          port: 80
          weight: 80
        - name: app-2-service
          port: 80
          weight: 20
