apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-deployment
  namespace: my-ns
  labels:
    app: app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      serviceAccountName: app-ksa
      containers:
        - name: app
          image: us-central1-docker.pkg.dev/devops-project-510903/my-repo/app:v1
          #imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              value: "127.0.0.1"
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: MYSQL_DATABASE
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: MYSQL_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: MYSQL_PASSWORD
            - name: DB_PORT
              value: "3306"
          resources:
            requests:
              cpu: "10m"
              memory: "50Mi"
            limits:
              cpu: "20m"
              memory: "100Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20
       
        # Cloud SQL Auth Proxy sidecar
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2
          env:
            - name: PROJECT_ID
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: PROJECT_ID
            - name: CLOUD_SQL_INSTANCE_NAME
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: CLOUD_SQL_INSTANCE_NAME
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              cpu: 20m
              memory: 40Mi
          args:
            - "--private-ip"
            - "--address=127.0.0.1"
            - "--port=3306"
            - "$(PROJECT_ID):us-central1:$(CLOUD_SQL_INSTANCE_NAME)"
