apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "myapp.fullname" . }}-app-2-deployment
  namespace: {{ .Values.namespace }}
  labels:
    app: app-2
    {{- include "myapp.labels" . | nindent 4 }}
spec:
  replicas: {{ index .Values.containers "app-2" "replicas" }}
  selector:
    matchLabels:
      app: app-2
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: app-2
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount }}
      containers:
        - name: app-2
          image: "{{ index .Values.containers "app-2" "image" }}:{{ index .Values.containers "app-2" "version" }}"
          #imagePullPolicy: Never
          ports:
            - containerPort: {{ index .Values.containers "app-2" "ports" }}
          env:
            - name: DB_HOST
              value: "127.0.0.1"
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: MYSQL_DATABASE
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: MYSQL_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: MYSQL_PASSWORD
            - name: DB_PORT
              value: "3306"
          resources:
            requests:
              cpu: {{ index .Values.containers "app-2" "requests-cpu" }}
              memory: {{ index .Values.containers "app-2" "requests-memory" }}
            limits:
              cpu: {{ index .Values.containers "app-2" "limits-cpu" }}
              memory: {{ index .Values.containers "app-2" "limits-memory" }}
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20

        # Cloud SQL Auth Proxy sidecar
        - name: cloud-sql-proxy
          image: "{{ index .Values.containers "cloud-sql-proxy" "image" }}:{{ index .Values.containers "cloud-sql-proxy" "version" }}"
          env:
            - name: PROJECT_ID
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: PROJECT_ID
            - name: CLOUD_SQL_INSTANCE_NAME
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: CLOUD_SQL_INSTANCE_NAME
          resources:
            requests:
              cpu: {{ index .Values.containers "cloud-sql-proxy" "requests-cpu" }}
              memory: {{ index .Values.containers "cloud-sql-proxy" "requests-memory" }}
            limits:
              cpu: {{ index .Values.containers "cloud-sql-proxy" "limits-cpu" }}
              memory: {{ index .Values.containers "cloud-sql-proxy" "limits-memory" }}
          args:
            - "--private-ip"
            - "--address=127.0.0.1"
            - "--port=3306"
            - "$(PROJECT_ID):us-central1:$(CLOUD_SQL_INSTANCE_NAME)"
