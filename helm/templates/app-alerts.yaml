
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule

metadata:
  name: app-alerts
  namespace: monitoring
  labels:
    release: monitoring

spec:
  groups:
    - name: application-alerts
      rules:
        - alert: ApplicationTargetDown
          expr: up{namespace="my-ns"} == 0
          for: 1m
          labels:
            severity: critical
          annotations:s
            summary: "Application target is down"
            description: >-
              A target in namespace my-ns has been
              unavailable for more than one minute.