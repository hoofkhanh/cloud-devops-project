apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "myapp.labels" . | nindent 4 }}

data:
  # Backend config
  MYSQL_DATABASE: {{ .Values.configMap.MYSQL_DATABASE }}
  PROJECT_ID: {{ .Values.configMap.PROJECT_ID }}
  CLOUD_SQL_INSTANCE_NAME: {{ .Values.configMap.CLOUD_SQL_INSTANCE_NAME }}