apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: apps-monitor
  namespace: my-ns
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - my-ns
  selector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - app-1
          - app-2
  endpoints:
    - port: http
      path: /metrics-broken
      interval: 15s