apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Values.secretManager.secretProviderClassName }}
  namespace: {{ .Values.namespace }}
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/{{ .Values.secretManager.projectNumber }}/secrets/{{ .Values.secretManager.secretName }}/versions/{{ .Values.secretManager.secretVersion }}"
        path: "sql.txt"