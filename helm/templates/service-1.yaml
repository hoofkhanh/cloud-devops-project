apiVersion: v1
kind: Service
metadata:
  name: {{ include "myapp.fullname" . }}-app-1-service
  namespace: {{ .Values.namespace}}
  labels:
    app: app-1
    {{- include "myapp.labels" . | nindent 4 }}
spec:
    type: ClusterIP
    selector:
      app: app-1
      app.kubernetes.io/instance: {{ .Release.Name }}
    ports:
      - protocol: TCP
        port: {{ index .Values.service "app-1" "port" }}
        targetPort: {{ index .Values.service "app-1" "targetPort" }}
